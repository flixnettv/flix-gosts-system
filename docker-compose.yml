version: '3.8'

services:
  app:
    build: .
    container_name: ghost-platform-app
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ghost}:${POSTGRES_PASSWORD:-ghost_pass}@db:5432/${POSTGRES_DB:-ghost_db}
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - APP_URL=${APP_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: ghost-platform-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ghost}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ghost_pass}
      - POSTGRES_DB=${POSTGRES_DB:-ghost_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
